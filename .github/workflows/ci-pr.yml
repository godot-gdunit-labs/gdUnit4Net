name: ci-pr
run-name: ${{ github.head_ref || github.ref_name }}-ci-pr

on: # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - '**.jpg'
      - '**.png'
      - '**.md'
  # - '**.yml'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:


concurrency:
  group: >-
    ci-pr-${{ github.event.pull_request.number || github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:

  # Bot pull requests pass this gate only after a maintainer approves the current head commit.
  approval:
    if: >-
      ${{ github.event_name != 'pull_request_review'
          || github.event.pull_request.user.login == 'gdunit4-bot[bot]' }}
    name: "✅ Approval"
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 1
    permissions:
      pull-requests: read
    steps:
      - name: 'Check for an approved review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: >-
            ${{ github.event.pull_request.number || github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$PR_AUTHOR" != "gdunit4-bot[bot]" ]]; then
            echo "No approval gate is required for this pull request."
            exit 0
          fi

          reviews=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")
          approved=$(jq --arg head "$PR_HEAD_SHA" --arg author "$PR_AUTHOR" \
            'add | group_by(.user.login) | map(max_by(.submitted_at))
             | any(.[]; .user.login != $author
               and .state == "APPROVED" and .commit_id == $head)' \
            <<< "$reviews")
          if [[ "$approved" != "true" ]]; then
            echo "::error::Approve this pull request commit before CI runs."
            exit 1
          fi
          echo "The current pull request commit has an approving review."

  setup-dotnet:
    name: "🔧 Setup .NET"
    needs: approval
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

  compile:
    name: "🔨 Compile Projects"
    needs: setup-dotnet
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Build Projects"
        run: |
          # The multi-project example consumes the locally built NuGet packages.
          dotnet build Analyzers/GdUnit4Analyzers.csproj --configuration Release
          dotnet build Api/GdUnit4Api.csproj --configuration Release
          dotnet build TestAdapter/GdUnit4TestAdapter.csproj --configuration Release
          dotnet restore
          # Build with the repository settings, so warnings the format check cannot detect fail the build
          dotnet build

      - name: "Cache Build Output"
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

  # Analyzer jobs

  analyzer-tests:
    name: "🧪 Test: Analyzers"
    needs: compile
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: "Run Unit Tests"
        if: ${{ !cancelled() }}
        run: |
          cd Analyzers.Test
          dotnet test --no-build --settings .runsettings --verbosity normal

      - name: "Upload Unit Test Reports"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: 10
          name: artifact_analyzer
          path: |
            Analyzers.Test/TestResults/test-result.trx
            Analyzers.Test/TestResults/test-result.html

  # The example projects disable code style enforcement in their build, so dotnet format checks them
  example-style-check:
    name: "🔍 Check Style: Examples"
    needs: setup-dotnet
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Check Code Formatting"
        if: ${{ !cancelled() }}
        run: |
          # The multi-project example restores the locally built gdUnit4 packages.
          dotnet build Analyzers/GdUnit4Analyzers.csproj --configuration Release
          dotnet build Api/GdUnit4Api.csproj --configuration Release
          dotnet build TestAdapter/GdUnit4TestAdapter.csproj --configuration Release
          dotnet format Example/ExampleProject.csproj --verify-no-changes --verbosity diagnostic
          dotnet format Example.MultiProject/Game/Game.csproj --verify-no-changes --verbosity diagnostic
          dotnet format Example.MultiProject/Game.Test/Game.Test.csproj --verify-no-changes --verbosity diagnostic

  # Test Adapter
  test-adapter-test:
    name: "🧪 Test: TestAdapter"
    needs: compile
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: "Run Unit Tests"
        if: ${{ !cancelled() }}
        run: |
          cd TestAdapter.Test
          dotnet test --settings .runsettings --no-build --verbosity normal

      - name: "Upload Unit Test Reports"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: 10
          name: artifact_adapter_tests
          path: |
            ./TestAdapter.Test/TestResults/test-result.trx
            ./TestAdapter.Test/TestResults/test-result.html


  api-tests:
    strategy:
      fail-fast: false
      max-parallel: 10
      # The only definition of the Godot test matrix, the report publishing follows the uploaded test artifacts
      matrix:
        gdunit-version: ['v6.2.2']
        godot-version: ['4.7.2']
        godot-status: ['stable']
        dotnet-version: ['net10.0']
        include:
          # Latest, also tested on Windows
          - gdunit-version: 'latest'
            windows: true
            godot-version: '4.7.2'
            godot-status: 'stable'
            dotnet-version: 'net10.0'
          # Latest prerelease
          - gdunit-version: 'v6.2.2'
            godot-version: '4.8'
            godot-status: 'beta3'
            dotnet-version: 'net10.0'


    name: "🧪 Test: API on Godot-v${{ matrix.godot-version }}-${{ matrix.godot-status }}"
    needs: [compile]
    uses: ./.github/workflows/unit-tests.yml
    with:
      gdunit-version: ${{ matrix.gdunit-version }}
      godot-version: ${{ matrix.godot-version }}
      godot-status: ${{ matrix.godot-status }}
      windows: ${{ matrix.windows == true }}


  finalize:
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request_review'
            || github.event.pull_request.user.login == 'gdunit4-bot[bot]') }}
    runs-on: ubuntu-latest
    name: Final Results
    needs: [approval, example-style-check, analyzer-tests, api-tests, test-adapter-test]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
