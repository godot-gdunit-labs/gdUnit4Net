name: 'Publish Test Report'
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['ci-pr']  # runs after ci-pr workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'ID of the workflow run to download artifacts from.'
        required: true
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  # The Godot test matrix is defined only in ci-pr.yml, the reports to publish follow the artifacts of the triggering run
  find-reports:
    name: "Find Test Reports"
    runs-on: ubuntu-24.04
    outputs:
      reports: ${{ steps.find.outputs.reports }}
    steps:
      - name: "Collect the Godot Reports of the Test Run"
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}
        run: |
          # Each Godot test run uploads 'artifact_api_tests_Godot<version>-<status>', the suffix names the report of one matrix entry
          reports=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired | not) | .name
              | select(test("^artifact_api_tests_Godot[0-9][0-9.]*-[a-z0-9]+$")) | ltrimstr("artifact_api_tests_")' \
            | jq --raw-input --null-input --compact-output '[inputs | select(length > 0)] | unique')
          echo "Found reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

  publish-reports:
    needs: find-reports
    if: ${{ needs.find-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        report: ${{ fromJSON(needs.find-reports.outputs.reports) }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Publish Analyzer Test Results
        if: ${{ matrix.report == 'Godot4.7-stable' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_analyzer
          name: report_analyzer
          path: '*.trx'
          report-title: Analyzer Tests
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      - name: Publish TestAdapter Test Results
        if: ${{ matrix.report == 'Godot4.7-stable' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_adapter_tests
          name: report_adapter_tests
          path: '*.trx'
          report-title: TestAdapter Tests
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'


      # publish Run gdUnit4-action results
      - name: Publish action Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_action_example_${{ matrix.report }}
          name: report_action_example_${{ matrix.report }}
          path: '**/Example/reports/*.xml'
          report-title: gdUnit4-action — ${{ matrix.report }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      # publish API Tests results
      - name: Publish API Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_api_tests_${{ matrix.report }}
          name: report_api_tests_${{ matrix.report }}
          path: '**/Api.Test/TestResults/*.trx'
          report-title: API Tests — ${{ matrix.report }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      # publish API E2E Tests results
      - name: Publish API E2E Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_api_e2e_tests_${{ matrix.report }}
          name: report_api_e2e_tests_${{ matrix.report }}
          path: '**/Api.Test/TestResults/*.trx'
          report-title: API E2E Tests — ${{ matrix.report }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      # publish Example Tests results
      - name: Download Example artifacts for code coverage
        if: ${{ matrix.report == 'Godot4.7-stable' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_example_tests_${{ matrix.report }}
          path: ./example-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Publish Example Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: artifact_example_tests_${{ matrix.report }}
          name: report_example_tests_${{ matrix.report }}
          path: '**/Example/TestResults/test-result.trx'
          report-title: Example Tests — ${{ matrix.report }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      - name: Publish Code Coverage Summary
        if: ${{ matrix.report == 'Godot4.7-stable' }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: './example-artifacts/**/*.cobertura.xml'
          badge: true
          format: markdown
          output: both
          hide_complexity: true
