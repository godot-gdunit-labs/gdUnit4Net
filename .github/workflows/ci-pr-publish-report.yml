name: 'Publish Test Report'
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['ci-pr']  # runs after ci-pr workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'ID of the workflow run to download artifacts from.'
        required: true
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  find-reports:
    name: "Find Test Report Artifacts"
    runs-on: ubuntu-24.04
    outputs:
      reports: ${{ steps.find.outputs.reports }}
    steps:
      - name: "Collect Report Artifacts"
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}
        run: |
          # The single-quoted jq program intentionally keeps its expressions literal to the shell.
          # shellcheck disable=SC2016
          reports=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq 'def humanize:
                    if . == "api" then "API"
                    elif . == "e2e" then "E2E"
                    elif . == "adapter" then "TestAdapter"
                    elif . == "multi-project" then "Multi-Project"
                    else (.[0:1] | ascii_upcase) + .[1:] end;
                  def artifact_title($artifact):
                    ($artifact | sub("^artifact_"; "")) as $name
                    | if $name == "analyzer" then "Analyzer Tests"
                      elif $name == "adapter_tests" then "TestAdapter Tests"
                      else ($name | sub("^multi_project_"; "multi-project_")) as $normalized
                        | if ($normalized | contains("_Godot")) then
                            ($normalized | split("_Godot")) as $parts
                            | ($parts[0] | split("_") | map(humanize) | join(" "))
                              + " Godot" + $parts[1]
                          else ($normalized | split("_") | map(humanize) | join(" ")) end
                      end;
                  .artifacts[] | select(.expired | not) | .name as $artifact
                  | (if $artifact == "artifact_analyzer" then
                       {path: "*.trx", coverage: false}
                     elif $artifact == "artifact_adapter_tests" then
                       {path: "*.trx", coverage: false}
                     elif ($artifact | startswith("artifact_action_example_")) then
                       {path: "**/Example/reports/*.xml", coverage: false}
                     elif ($artifact | startswith("artifact_api_tests_")) then
                       {path: "**/Api.Test/TestResults/*.trx", coverage: false}
                     elif ($artifact | startswith("artifact_api_e2e_tests_")) then
                       {path: "**/Api.Test/TestResults/*.trx", coverage: false}
                     elif ($artifact | startswith("artifact_example_tests_")) then
                       {path: "**/Example/TestResults/test-result.trx", coverage: ($artifact == "artifact_example_tests_Godot4.7-stable")}
                     elif ($artifact | startswith("artifact_multi_project_example_tests_")) then
                       {path: "**/*.trx", coverage: false}
                     elif ($artifact | startswith("artifact_windows_tests_")) then
                       {path: "**/*.trx", coverage: false}
                     else empty end) as $details
                  | $details + {artifact: $artifact, title: artifact_title($artifact)}' \
            | jq --slurp --compact-output 'unique_by(.artifact) | sort_by(.artifact)')
          echo "Found reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

  publish-reports:
    needs: find-reports
    if: ${{ needs.find-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.find-reports.outputs.reports) }}

    steps:
      - name: "Download ${{ matrix.artifact }}"
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ./report-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: "Publish ${{ matrix.title }}"
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: report_${{ matrix.artifact }}
          path: report-artifact/${{ matrix.path }}
          report-title: ${{ matrix.title }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'true'

      - name: Publish Code Coverage Summary
        if: ${{ matrix.coverage }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: './report-artifact/**/*.cobertura.xml'
          badge: true
          format: markdown
          output: both
          hide_complexity: true
