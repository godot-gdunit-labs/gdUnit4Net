name: 'Publish Test Report'
on:
  workflow_run:
    workflows: [ 'ci-pr' ]  # runs after ci-pr workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'ID of the workflow run to download artifacts from.'
        required: true
        default: ''

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # The Godot test matrix is defined only in ci-pr.yml, the reports to publish follow the artifacts of the triggering run
  find-reports:
    name: "Find Test Reports"
    runs-on: ubuntu-24.04
    outputs:
      reports: ${{ steps.find.outputs.reports }}
    steps:
      - name: "Collect the Godot Reports of the Test Run"
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}
        run: |
          # Each Godot test run uploads 'artifact_api_tests_Godot<version>-<status>', the suffix names the report of one matrix entry
          reports=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired | not) | .name | select(test("^artifact_api_tests_Godot[0-9][0-9.]*-[a-z0-9]+$")) | ltrimstr("artifact_api_tests_")' \
            | jq --raw-input --null-input --compact-output '[inputs | select(length > 0)] | unique')
          echo "Found reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

  publish-reports:
    needs: find-reports
    if: ${{ needs.find-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        report: ${{ fromJSON(needs.find-reports.outputs.reports) }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      # publish Analyzer Tests results
      - name: Download Analyzer tests artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_analyzer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}


      # publish TestAdapter Tests results
      - name: Download TestAdapter tests artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_adapter_tests
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}


      - name: Publish API Test Results
        uses: dorny/test-reporter@v3.2.0
        with:
          name: artifact_analyzer
          # using artifact to download is broken since download-artifact@v4 see https://github.com/dorny/test-reporter/issues/363
          # We do the download manually on step `Download artifacts`
          #artifact: artifact_gdUnit4_${{ matrix.report }}${{ matrix.godot-net }}
          path: './home/runner/work/gdUnit4Net/gdUnit4Net/Analyzers.Test/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'


      # publish Run gdUnit4-action results
      - name: Download action tests artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_action_example_${{ matrix.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Publish action Test Results
        uses: dorny/test-reporter@v3.2.0
        with:
          name: report_action_example_${{ matrix.report }}
          # using artifact to download is broken since download-artifact@v4 see https://github.com/dorny/test-reporter/issues/363
          # We do the download manually on step `Download artifacts`
          #artifact: artifact_gdUnit4_${{ matrix.report }}${{ matrix.godot-net }}
          path: './home/runner/work/gdUnit4Net/gdUnit4Net/Example/reports/*.xml'
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'

      # publish API Tests results
      - name: Download API tests artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_api_tests_${{ matrix.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Publish API Test Results
        uses: dorny/test-reporter@v3.2.0
        with:
          name: report_api_tests_${{ matrix.report }}
          # using artifact to download is broken since download-artifact@v4 see https://github.com/dorny/test-reporter/issues/363
          # We do the download manually on step `Download artifacts`
          #artifact: artifact_gdUnit4_${{ matrix.report }}${{ matrix.godot-net }}
          path: './home/runner/work/gdUnit4Net/gdUnit4Net/Api.Test/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'

      # publish Example Tests results
      - name: Download Example tests artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: artifact_example_tests_${{ matrix.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: godot-gdunit-labs/gdUnit4Net
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Publish Example Test Results
        uses: dorny/test-reporter@v3.2.0
        with:
          name: report_example_tests_${{ matrix.report }}
          path: './home/runner/work/gdUnit4Net/gdUnit4Net/Example/TestResults/test-result.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'

      - name: Publish Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: './home/runner/work/gdUnit4Net/gdUnit4Net/Example/TestResults/**/*.cobertura.xml'
          badge: true
          format: markdown
          output: both
          hide-complexity: true
