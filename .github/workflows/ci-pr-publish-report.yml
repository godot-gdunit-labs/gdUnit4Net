name: 'Publish Test Report'
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['ci-pr']  # runs after ci-pr workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'ID of the workflow run to download artifacts from.'
        required: true
        default: ''

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # Runs in the base repository context, so reports of fork pull requests can be attached to the tested commit.
  # Artifact names and contents come from the triggering run and are untrusted: no checkout of the tested commit,
  # no expression interpolation into scripts.
  find-reports:
    name: "Find Test Report Artifacts"
    runs-on: ubuntu-24.04
    outputs:
      reports: ${{ steps.find.outputs.reports }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: "Collect Report Artifacts"
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}
        run: |
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          reports=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq 'def report_title($id):
                    ($id | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join(" "))
                    | gsub("Api"; "API")
                    | gsub("E2e"; "E2E")
                    | gsub("Adapter Tests"; "TestAdapter Tests")
                    | gsub("Analyzer$"; "Analyzer Tests")
                    | gsub("Multi Project"; "Multi-Project");
                  .artifacts[] | select(.expired | not) | .name as $artifact
                  | select($artifact | test(
                      "^artifact_(analyzer|adapter_tests|(action_example|api_e2e_tests|api_tests|example_tests|" +
                      "multi_project_example_tests|windows_tests)_Godot[0-9][0-9.]*-[a-z0-9]+)$"
                    ))
                  | ($artifact | ltrimstr("artifact_")) as $id
                  | {artifact: $artifact, id: $id, title: report_title($id)}' \
            | jq --slurp --compact-output '
                unique_by(.artifact)
                | (map(select(.id | startswith("example_tests_"))) | first | .artifact) as $coverage
                | map(. + {coverage: (.artifact == $coverage)})')
          echo "Found reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

  publish-reports:
    name: ${{ matrix.title }}
    needs: find-reports
    if: ${{ needs.find-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.find-reports.outputs.reports) }}

    steps:
      # workflow_run: dorny/test-reporter downloads the artifact of the triggering run itself and attaches the check
      # run to its commit. workflow_dispatch: dorny/test-reporter only sees the artifacts of the dispatch run, so the
      # artifact is downloaded by run id and parsed locally, which needs a git checkout for `git ls-files`.
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Download ${{ matrix.artifact }}
        if: ${{ github.event_name == 'workflow_dispatch' || matrix.coverage }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.find-reports.outputs.run-id }}

      - name: Publish ${{ matrix.title }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: ${{ github.event_name == 'workflow_run' && matrix.artifact || '' }}
          name: report_${{ matrix.id }}
          path: '**/*.trx,**/Example/reports/results.xml'
          report-title: ${{ matrix.title }}
          reporter: dotnet-trx
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'

      # Only the per-test-run folder, the 'In/<machine>' folder holds a copy of the same coverage file
      - name: Create Code Coverage Summary
        if: ${{ matrix.coverage }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: '**/Example/TestResults/*/*.cobertura.xml'
          badge: true
          format: markdown
          output: both
          hide_complexity: true

      - name: Publish Code Coverage Summary
        if: ${{ matrix.coverage }}
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
