name: unit-tests
run-name: ${{ github.head_ref || github.ref_name }}-unit-tests

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: 'ubuntu-22.04'
      gdunit-version:
        required: true
        type: string
      godot-version:
        required: true
        type: string
      godot-status:
        required: true
        type: string
      windows:
        description: 'Also runs the API and the test adapter tests on Windows'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      os:
        required: false
        type: string
        default: 'ubuntu-22.04'
      godot-version:
        required: true
        type: string
      godot-status:
        required: true
        type: string
      windows:
        description: 'Also runs the API and the test adapter tests on Windows'
        required: false
        type: boolean
        default: false

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref_name }}-${{ inputs.godot-version }}
  cancel-in-progress: true

jobs:

  unit-test-runner:
    permissions:
      actions: write
      contents: read

    name: "Run gdUnit4-action"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: 'Test Example via gdunit-action - Godot_${{ inputs.godot-version }}-${{ inputs.godot-status }}-net'
        uses: MikeSchulze/gdUnit4-action@v1
        env:
          # The action runs `dotnet test` without a filter argument, MSBuild takes the test filter from this variable.
          # `ExampleTest.Failed` fails by design, the job `unit-test-example` verifies that failure.
          VSTestTestCaseFilter: 'FullyQualifiedName!=Examples.Test.ExampleTest.Failed'
        with:
          version: ${{ inputs.gdunit-version }}
          godot-version: ${{ inputs.godot-version }}
          godot-status: ${{ inputs.godot-status }}
          godot-net: true
          project_dir: './Example/'
          # The action ignores the paths for C# tests and runs all tests of the project
          paths: |
            res://test
          timeout: 2
          publish-report: false
          report-name: 'action_example_Godot${{ inputs.godot-version }}-${{ inputs.godot-status }}'


  unit-test-adapter:
    name: "Run API Tests"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: "Install Godot Net ${{ inputs.godot-version }}"
        uses: ./.github/actions/godot-install
        with:
          godot-version: ${{ inputs.godot-version }}
          godot-mono: true
          godot-status-version: ${{ inputs.godot-status }}
          godot-bin-name: 'linux_x86_64'
          godot-cache-path: '~/godot-linux'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: "Run Unit Tests"
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GODOT_BIN: "/home/runner/godot-linux/godot"
        run: |
          cd ./Api.Test
          # Rebuild the project to ensure compatibility with the specific Godot version being tested
          # Each Godot version may require different build configurations and references
          # Style checks are disabled to prevent formatting errors from blocking tests
          dotnet build /p:EnforceCodeStyleInBuild=false /p:TreatWarningsAsErrors=false

          # Launch Godot to properly build the solutions
          # The headless flag runs without UI, and quit-after ensures it doesn't hang
          $GODOT_BIN --path . --headless --build-solutions --quit-after 200 --verbosity normal

          # Run the actual tests with xvfb (X Virtual FrameBuffer) to support GUI operations in headless environment
          # Using CI-specific settings file and skipping the build step since we already built above
          xvfb-run --auto-servernum dotnet test GdUnit4ApiTest.csproj --no-build --settings .runsettings-ci --verbosity normal
          # -verbosity:diag --blame

      - name: "Upload Unit Test Reports"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-test-report
        with:
          report-name: api_tests_Godot${{ inputs.godot-version }}-${{ inputs.godot-status }}

  unit-test-example:
    name: "Run Test Examples"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: "Install Godot Net ${{ inputs.godot-version }}"
        uses: ./.github/actions/godot-install
        with:
          godot-version: ${{ inputs.godot-version }}
          godot-mono: true
          godot-status-version: ${{ inputs.godot-status }}
          godot-bin-name: 'linux_x86_64'
          godot-cache-path: '~/godot-linux'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Restore Build Cache"
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: |
            **/obj
            **/bin
            **/nupkg
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: "Run Unit Tests"
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GODOT_BIN: "/home/runner/godot-linux/godot"
        run: |
          $GODOT_BIN --path ./Example --headless --build-solutions --quit-after 20
          xvfb-run --auto-servernum dotnet test ./Example/ExampleProject.csproj --no-build --settings ./Example/.runsettings-ci || true

        # Step to validate test results
      - name: Validate Test Results
        shell: bash
        run: |
          validate_section() {
            local section="$1"
            local expected_content="$2"

            grep -A 50 "$section" ./Example/TestResults/test-result.trx | sed -e 's/^[ \t]*//' | tee output.txt >/dev/null
            if grep -qF "$expected_content" output.txt; then
              echo "Test validation passed. The expected text is present in $section."
            else
              echo "Test validation failed. The expected content '$expected_content' is not present in:"
              echo ""
              cat output.txt
              echo ""
              exit 1
            fi
          }

          validate_section '<Output>' 'Discover tests done, 6 TestSuites and total 35 Tests found.'
          validate_section '<Results>' "<Message>Expecting: 'True' but is 'False'</Message>"
          validate_section '<Results>' '<StackTrace>   at Examples.Test.ExampleTest.Failed() in /home/runner/work/gdUnit4Net/gdUnit4Net/Example/test/ExampleTest.cs:line 19'
          validate_section '<ResultSummary' '<ResultSummary outcome="Failed">'
          validate_section '<ResultSummary' '<Counters total="39" executed="39" passed="38" failed="1" error="0" timeout="0" aborted="0" inconclusive="0" passedButRunAborted="0" notRunnable="0" notExecuted="0" disconnected="0" warning="0" completed="0" inProgress="0" pending="0" />'
          echo "All tests passes."

      - name: Validate Code Coverage Report
        shell: bash
        run: |
          coverage_file=$(find ./Example/TestResults -name "*.cobertura.xml" | head -1)
          if [ -z "$coverage_file" ]; then
            echo "Code coverage validation failed: no cobertura.xml found in ./Example/TestResults"
            exit 1
          fi
          lines_covered=$(grep -oE 'lines-covered="[0-9]+"' "$coverage_file" | grep -oE '[0-9]+' | head -1)
          if [ -z "$lines_covered" ] || [ "$lines_covered" -eq 0 ]; then
            echo "Code coverage validation failed: lines-covered is 0 or missing in $coverage_file"
            exit 1
          fi
          echo "Code coverage validation passed: $coverage_file (lines-covered=$lines_covered)"

      - name: "Upload Unit Test Reports"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-test-report
        with:
          report-name: example_tests_Godot${{ inputs.godot-version }}-${{ inputs.godot-status }}

  unit-test-windows:
    name: "Run API and TestAdapter Tests on Windows"
    if: ${{ inputs.windows }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: "Install Godot Net ${{ inputs.godot-version }}"
        uses: ./.github/actions/godot-install
        with:
          godot-version: ${{ inputs.godot-version }}
          godot-mono: true
          godot-status-version: ${{ inputs.godot-status }}
          godot-bin-name: 'win64'
          godot-cache-path: '~/godot-windows'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: "Run TestAdapter Tests"
        timeout-minutes: 5
        run: |
          # The discovery tests read the assembly of the example project, which the Linux jobs take from the build cache
          dotnet build ./Example/ExampleProject.csproj
          cd ./TestAdapter.Test
          dotnet test --settings .runsettings --verbosity normal

      - name: "Run API Tests"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          # The tests start Godot as a Windows process, which needs a Windows path
          GODOT_BIN=$(cygpath --windows "$HOME/godot-windows/godot.exe")
          export GODOT_BIN
          cd ./Api.Test
          # Style checks are disabled to prevent formatting errors from blocking tests
          dotnet build -p:EnforceCodeStyleInBuild=false -p:TreatWarningsAsErrors=false

          # The console executable prints the Godot output to the log
          "$HOME/godot-windows/godot_console.exe" --path . --headless --build-solutions --quit-after 200 --verbosity normal

          # The CI settings use the X11 display driver of the Linux runners, Windows uses its own display driver
          # and renders through ANGLE, because the runners have no OpenGL driver
          dotnet test GdUnit4ApiTest.csproj --no-build --settings .runsettings-ci --verbosity normal \
            -- "GdUnit4.Parameters=--audio-driver Dummy --display-driver windows --rendering-driver opengl3_angle --verbose"

      - name: "Upload Unit Test Reports"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: 10
          name: artifact_windows_tests_Godot${{ inputs.godot-version }}-${{ inputs.godot-status }}
          path: |
            ./Api.Test/TestResults/**
            ./Api.Test/reports/**
            ./TestAdapter.Test/TestResults/**
